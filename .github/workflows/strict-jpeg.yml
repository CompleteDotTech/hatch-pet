name: Strict JPEG decoder admission

on:
  pull_request:
    paths:
      - '.github/workflows/strict-jpeg.yml'
      - 'requirements-rig*.txt'
      - 'scripts/rig*.py'
      - 'tests/test_rig_jpeg.py'
      - 'tests/test_rig_texture_integrity.py'
      - 'tests/test_rig_skinning.py'
      - 'tests/test_rig_math.py'
      - 'tests/fixtures/strict-jpeg-*.jpg'
  push:
    branches: [main]
    paths:
      - '.github/workflows/strict-jpeg.yml'
      - 'requirements-rig*.txt'
      - 'scripts/rig*.py'
      - 'tests/test_rig_jpeg.py'
      - 'tests/test_rig_texture_integrity.py'
      - 'tests/test_rig_skinning.py'
      - 'tests/test_rig_math.py'
      - 'tests/fixtures/strict-jpeg-*.jpg'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  jpeg:
    name: Strict JPEG (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
      PYTHONPATH: scripts
    defaults:
      run:
        shell: bash --noprofile --norc -eo pipefail {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-rig-test.txt
      - run: |
          python -m unittest discover -s tests -p test_rig_jpeg.py -v 2>&1 | tee strict-jpeg-tests.log
          python -m unittest discover -s tests -p test_rig_texture_integrity.py -v 2>&1 | tee -a strict-jpeg-tests.log
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: strict-jpeg-${{ runner.os }}-${{ github.sha }}
          if-no-files-found: error
          path: strict-jpeg-tests.log
