name: Transfer Model3D fixture correction
on:
  push:
    branches: ['agent/roadmap-capture-20261023']
    paths: ['.github/workflows/model3d-test-fixture-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: c08a73a3ed93ec1dbf0c9e1d34448cf3a168d3a6
          persist-credentials: false
      - name: Verify and upload one unreferenced test blob
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, os, subprocess, urllib.request
          from pathlib import Path
          path = 'tests/test_model3d_contracts.py'
          data = subprocess.check_output(['git', 'show', 'HEAD:' + path])
          def blob_sha(content):
              return hashlib.sha1(b'blob ' + str(len(content)).encode() + b'\0' + content).hexdigest()
          assert blob_sha(data) == '07b53ffa15c5a452890f8fb03f6cc8ab91d06680'
          text = data.decode('utf-8')
          needle = '    path = root / (identifier + suffix)'
          assert text.count(needle) == 1
          text = text.replace(needle, '    # The importer returns canonical paths (macOS /private/var and Windows\n'
              '    # expanded short names); derive the inventory from the same existing root.\n'
              '    root = root.resolve()\n' + needle, 1)
          test = '''    def test_fixture_and_inspection_support_aliased_workspace_root(self):
                  actual = self.root / 'actual-workspace'
                  actual.mkdir()
                  alias = self.root / 'workspace-alias'
                  try:
                      alias.symlink_to(actual, target_is_directory=True)
                  except OSError as exc:
                      self.skipTest('Host cannot create directory symlinks: ' + str(exc))
                  link_target = alias.readlink()
                  canonical_root = actual / 'project'
                  canonical_root.mkdir()
                  aliased_root = alias / 'project'
                  for suffix in ('.glb', '.gltf'):
                      with self.subTest(suffix=suffix):
                          asset = asset_fixture(aliased_root, 'aliased-' + suffix[1:], suffix=suffix)
                          report = validate_document(asset, aliased_root)
                          self.assertTrue(report['payloads_verified'])
                          self.assertTrue(report['geometry_inspected'])
                          self.assertEqual(report, validate_document(asset, canonical_root))
                          for record in asset['files']:
                              self.assertFalse(Path(record['path']).is_absolute())
                              self.assertEqual((aliased_root / record['path']).read_bytes(),
                                               (canonical_root / record['path']).read_bytes())
                  self.assertTrue(alias.is_symlink())
                  self.assertEqual(alias.readlink(), link_target)

          '''
          # Remove the ten extra indentation spaces used by this multiline literal.
          lines = test.splitlines(keepends=True)
          test = lines[0] + ''.join(line[10:] if line.startswith('          ') else line for line in lines[1:])
          needle = '    def test_obj_boundary_and_independent_glb_reader(self):\n'
          assert text.count(needle) == 1
          content = text.replace(needle, test + needle, 1).encode('utf-8')
          expected = '3dd7d3c2f3eae3a95af44d23c225c1b268c7df64'
          assert blob_sha(content) == expected, blob_sha(content)
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  raise ValueError('Unexpected API redirect')
          request = urllib.request.Request(
              'https://api.github.com/repos/CompleteTech-Skills/hatch-pet/git/blobs',
              data=json.dumps({'content': base64.b64encode(content).decode(), 'encoding': 'base64'}).encode(),
              headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                       'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json',
                       'X-GitHub-Api-Version': '2022-11-28'}, method='POST')
          with urllib.request.build_opener(NoRedirect()).open(request, timeout=45) as response:
              result = json.load(response)
          assert result['sha'] == expected
          receipt = {'base': 'c08a73a3ed93ec1dbf0c9e1d34448cf3a168d3a6', 'path': path,
                     'blob': expected, 'sha256': hashlib.sha256(content).hexdigest(),
                     'branch_updated': False, 'tests_executed': False}
          Path('fixture-transfer.json').write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: model3d-fixture-transfer
          path: fixture-transfer.json
          if-no-files-found: error
          retention-days: 7
