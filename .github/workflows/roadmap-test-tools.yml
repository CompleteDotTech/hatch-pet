name: Roadmap interchange test tools
on:
  push:
    branches: ['agent/roadmap-capture-20261023']
    paths: ['.github/workflows/roadmap-test-tools.yml']
permissions:
  contents: read
jobs:
  tools:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Download repository-pinned glTF reader and its Python dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tools
          python -m pip download --only-binary=:all: --dest tools pygltflib==1.16.5
          python -m pip --version > tools/pip-version.txt
          python --version > tools/python-version.txt
          (cd tools && sha256sum *.whl > SHA256SUMS)
      - uses: actions/upload-artifact@v4
        with:
          name: hatch-pet-interchange-tools
          path: tools/
          retention-days: 7
