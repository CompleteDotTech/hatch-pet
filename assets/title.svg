<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 220" width="900" height="220" role="img" aria-label="hatch-pet">
  <defs>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffb38a"/>
      <stop offset="35%" stop-color="#ff7a85"/>
      <stop offset="65%" stop-color="#ffd27a"/>
      <stop offset="100%" stop-color="#8fe3c8"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0; 1 0; -1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="ink2" href="#ink" spreadMethod="reflect"/>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffd27a" stop-opacity=".9"/>
      <stop offset="100%" stop-color="#ffd27a" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- the egg -->
  <g transform="translate(118 112)">
    <circle r="62" fill="url(#glow)">
      <animate attributeName="r" values="54;66;54" dur="3.2s" repeatCount="indefinite"/>
    </circle>
    <g>
      <animateTransform attributeName="transform" type="rotate" values="0;-7;6;-4;0;0;0" keyTimes="0;.08;.16;.24;.32;.9;1" dur="3.2s" repeatCount="indefinite"/>
      <path d="M0 -50 C 30 -50 40 -6 40 16 C 40 40 22 52 0 52 C -22 52 -40 40 -40 16 C -40 -6 -30 -50 0 -50Z" fill="#fff4e6"/>
      <circle cx="-14" cy="-14" r="5" fill="#ffb38a"/>
      <circle cx="16" cy="4" r="4" fill="#8fe3c8"/>
      <circle cx="-6" cy="24" r="3.5" fill="#ff7a85"/>
      <circle cx="20" cy="-26" r="3" fill="#ffd27a"/>
      <path d="M-40 6 L-24 -4 L-12 8 L2 -6 L14 6 L28 -4 L40 6" fill="none" stroke="#ffd27a" stroke-width="3.5" stroke-linejoin="round" filter="url(#soft)">
        <animate attributeName="stroke-opacity" values=".15;1;.15" dur="3.2s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <!-- word -->
  <text x="208" y="138" font-family="'Fredoka','Baloo 2','Nunito','Segoe UI Rounded','Trebuchet MS',system-ui,sans-serif" font-weight="700" font-size="104" letter-spacing="-2" fill="url(#ink2)" filter="url(#soft)">hatch-pet</text>
  <text x="212" y="184" font-family="'Nunito','Segoe UI',system-ui,sans-serif" font-size="22" letter-spacing="5" fill="#c9b8ff" fill-opacity=".9">ONE IDEA IN · A LIVING PET OUT</text>

  <!-- fireflies -->
  <g fill="#ffd27a">
    <circle cx="170" cy="40" r="2.5"><animate attributeName="cy" values="60;20;60" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="80" cy="30" r="2"><animate attributeName="cy" values="50;8;50" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="840" cy="60" r="3"><animate attributeName="cy" values="90;30;90" dur="7s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;.9;0" dur="7s" repeatCount="indefinite"/></circle>
    <circle cx="780" cy="40" r="2"><animate attributeName="cy" values="60;14;60" dur="4.4s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="4.4s" repeatCount="indefinite"/></circle>
    <circle cx="610" cy="30" r="1.8" fill="#8fe3c8"><animate attributeName="cy" values="40;6;40" dur="5.8s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="5.8s" repeatCount="indefinite"/></circle>
    <circle cx="420" cy="26" r="1.6" fill="#ff7a85"><animate attributeName="cy" values="36;4;36" dur="6.2s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;0" dur="6.2s" repeatCount="indefinite"/></circle>
  </g>
</svg>
